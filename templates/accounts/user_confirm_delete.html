{% extends "base.html" %}
{% block title %}Supprimer compte{% endblock %}
{% block content %}
<div class="card-myedu p-4 mt-3" style="max-width:500px;margin:auto;">
  <div class="section-title text-danger">Confirmer la suppression</div>
  <p>Voulez-vous vraiment supprimer le compte de <strong>{{ obj.get_full_name }}</strong> ?</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-myedu">Annuler</a>
  </form>
</div>
{% endblock %}
