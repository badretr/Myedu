{% extends "base.html" %}
{% block title %}Publier une actualite - Myedu{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-myedu">
  <li class="breadcrumb-item"><a href="{% url 'core:home' %}">Accueil</a></li>
  <li class="breadcrumb-item active">Nouvelle actualite</li>
</ol></nav>
<div class="card-myedu p-4" style="max-width:700px;">
  <div class="section-title">Publier une actualite</div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Titre</label><input type="text" name="title" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Contenu</label><textarea name="content" class="form-control" rows="6" required></textarea></div>
    <div class="form-check mb-3">
      <input type="checkbox" name="is_public" id="pubCheck" class="form-check-input" checked>
      <label for="pubCheck" class="form-check-label">Visible par tous</label>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary-myedu"><i class="fas fa-bullhorn me-2"></i>Publier</button>
      <a href="{% url 'core:home' %}" class="btn btn-outline-myedu">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
