{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myedu - Plateforme scolaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/myedu.css' %}?v=20260712-bg" rel="stylesheet">
</head>
<body>
<div class="login-wrapper home-public-shell" style="flex-direction:column;gap:2rem;padding:2rem;">
  <div style="text-align:center;color:var(--ink);">
    <h1 style="font-size:3rem;"><i class="fas fa-graduation-cap me-3" style="color:var(--accent);"></i>Myedu</h1>
    <p style="font-size:1.1rem;color:var(--muted);">Plateforme de gestion scolaire moderne</p>
  </div>
  <div class="row g-3 home-public-news" style="max-width:900px;width:100%;">
    {% for item in news %}
    <div class="col-md-6">
      <div class="news-item">
        <div class="news-title">{{ item.title }}</div>
        <div class="news-date">{{ item.created_at|date:"d/m/Y H:i" }}</div>
        {% if item.image %}
          <img src="{{ item.image.url }}" alt="{{ item.title }}" class="img-fluid rounded-3 mb-3" style="max-height:260px;object-fit:cover;width:100%;">
        {% endif %}
        <p style="font-size:0.9rem;color:#374151;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;">{{ item.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary-myedu" style="padding:0.8rem 2.5rem;font-size:1rem;">
    <i class="fas fa-sign-in-alt me-2"></i>Connexion
  </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
