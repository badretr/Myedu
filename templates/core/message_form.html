{% extends "base.html" %}
{% block title %}Nouveau message - Myedu{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-myedu">
  <li class="breadcrumb-item"><a href="{% url 'core:home' %}">Accueil</a></li>
  <li class="breadcrumb-item"><a href="{% url 'core:inbox' %}">Messages</a></li>
  <li class="breadcrumb-item active">Nouveau message</li>
</ol></nav>
<div class="card-myedu p-4" style="max-width:700px;">
  <div class="section-title">Envoyer un message</div>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Titre</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Destinataire (classe)</label>
      <select name="classroom" class="form-select">
        <option value="">-- Tous les etudiants --</option>
        {% for cl in classrooms %}<option value="{{ cl.pk }}">{{ cl }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Contenu</label>
      <textarea name="content" class="form-control" rows="6" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Piece jointe (optionnel)</label>
      <input type="file" name="attachment" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary-myedu"><i class="fas fa-paper-plane me-2"></i>Envoyer</button>
      <a href="{% url 'core:inbox' %}" class="btn btn-outline-myedu">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
